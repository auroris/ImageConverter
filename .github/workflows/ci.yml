name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check dependency advisories
        run: npm run audit:ci
      - run: npm run lint
      - name: Unit and packaging tests
        run: npm test
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Browser conversion tests
        run: npm run test:browser
