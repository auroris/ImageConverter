name: Package and Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Get Version
      run: echo "VERSION=$(jq -r .version src/manifest.json)" >> $GITHUB_ENV

    - name: Build Per-Browser Packages
      run: npm run build

    - name: Package Extension
      run: |
        (cd dist/firefox && zip -r -Z deflate ../../ImageConverter-firefox-${{ env.VERSION }}.zip .)
        (cd dist/chromium && zip -r -Z deflate ../../ImageConverter-chromium-${{ env.VERSION }}.zip .)

    - name: Create and Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        files: |
          ImageConverter-firefox-${{ env.VERSION }}.zip
          ImageConverter-chromium-${{ env.VERSION }}.zip
