<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Image Converter</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            font-size: 14px;
            margin: 16px;
            background: #ffffff;
            color: #202124;
        }
        label {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin: 2px 0 0;
        }
        .note {
            color: #5f6368;
            font-size: 0.92em;
            margin: 6px 0 0 25px;
            max-width: 42em;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #292a2d;
                color: #e8eaed;
            }
            .note {
                color: #9aa0a6;
            }
        }
    </style>
</head>
<body>
    <label>
        <input type="checkbox" id="all-sites" disabled>
        <span id="all-sites-label"></span>
    </label>
    <p class="note" id="all-sites-note"></p>
    <script src="options.js"></script>
</body>
</html>
